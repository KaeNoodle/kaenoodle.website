<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaeNoodle</title>
  <meta name="description" content="Kae, a fursuit maker and artist in Perth, Western Australia. Find me on Telegram and X.">
  <meta name="theme-color" content="#F05152">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600&display=swap">

  <style>
    :root {
      --coral: #F05152;
      --blue: #217AF2;
      --gold: #C9971C;
      --gold-light: #E2B23A;
      --lavender: #D3D4F5;
      --ink: #1B1B2F;
      --navy: #1F2039;
      --muted: #55566A;
      --pink: #DF4278;
      --telegram: #1D6CD6;
      --channel: #58B44B;
      color-scheme: light;
    }

    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      background: #FFFFFF;
      color: var(--ink);
      font-family: "Figtree", "Segoe UI", system-ui, sans-serif;
    }

    /* Coral + blue band, then the gold strip */
    .band { display: grid; grid-template-columns: 1fr 1fr; height: 18px; }
    .band span:first-child { background: var(--coral); }
    .band span:last-child { background: var(--blue); }
    .band-gold { height: 8px; background: var(--gold); }

    main {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      background: var(--lavender);
    }

    .content {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    .intro { display: flex; flex-direction: column; gap: 18px; }

    .site-name {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--navy);
    }

    .rule { width: 72px; height: 4px; border-radius: 2px; background: var(--gold); }

    /* Name and character stay on one line at every width */
    .name-row { display: flex; flex-wrap: nowrap; align-items: center; gap: 12px; }

    h1 {
      margin: 0;
      flex: 0 1 auto;
      min-width: 0;
      font-family: "Bricolage Grotesque", "Segoe UI", sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 0.4rem + 8.5vw, 5.5rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--gold);
    }
    h1 span { color: var(--coral); }

    .character {
      flex: 0 0 auto;
      width: clamp(52px, 15vw, 116px);
      height: auto;
      display: block;
      margin: clamp(-43px, -4vw, -12px) 0;
    }

    .tagline { margin: 0; font-size: 18px; line-height: 1.55; }

    .socials { display: flex; flex-direction: column; gap: 14px; }

    .link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      border: 2px solid var(--ink);
      border-radius: 16px;
      background: #FFFFFF;
      color: var(--ink);
      text-decoration: none;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .link:hover { transform: translateY(-2px); border-color: var(--gold); box-shadow: 0 5px 0 var(--gold); }
    .link:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

    .icon {
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-telegram { background: var(--telegram); }
    .icon-channel { background: var(--channel); }
    .icon-x { background: var(--navy); }

    .link-text { flex-grow: 1; display: flex; flex-direction: column; gap: 2px; }
    .link-title { font-size: 17px; font-weight: 600; }
    .link-sub { font-size: 15px; color: var(--muted); }
    .arrow { flex: none; }

    footer {
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #6B6C7E;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
      .link:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="band" aria-hidden="true"><span></span><span></span></div>
  <div class="band-gold" aria-hidden="true"></div>

  <main>
    <div class="content">
      <section class="intro">
        <p class="site-name">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <g fill="#DF4278">
              <circle cx="12" cy="6.2" r="3.8"/><circle cx="17.5" cy="10.2" r="3.8"/><circle cx="15.4" cy="16.7" r="3.8"/><circle cx="8.6" cy="16.7" r="3.8"/><circle cx="6.5" cy="10.2" r="3.8"/>
            </g>
            <circle cx="12" cy="12" r="2.6" fill="#FFFFFF"/>
          </svg>
          kaenoodle.au
        </p>

        <div class="rule" aria-hidden="true"></div>

        <div class="name-row">
          <h1>Kae<span>Noodle</span></h1>
          <img class="character" src="kae-character.webp" width="400" height="582"
               alt="Kae's character, a red dragon with blue and white tufts, hugging a spool of gold thread">
        </div>

        <p class="tagline">Fursuit maker &amp; artist<br>&nbsp; &nbsp; Perth - Western Australia.</p>
      </section>

      <nav class="socials" aria-label="Socials">
        <a class="link" href="https://t.me/KaeNoodle" target="_blank" rel="noopener">
          <span class="icon icon-telegram" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2z"/></svg>
          </span>
          <span class="link-text">
            <span class="link-title">Telegram</span>
            <span class="link-sub">Message me · @KaeNoodle</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="arrow" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
        </a>

        <a class="link" href="https://t.me/TheKaeRoom" target="_blank" rel="noopener">
          <span class="icon icon-channel" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
          </span>
          <span class="link-text">
            <span class="link-title">The Kae Room</span>
            <span class="link-sub">Telegram update channel · @TheKaeRoom</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="arrow" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
        </a>

        <a class="link" href="https://x.com/KaeNoodle" target="_blank" rel="noopener">
          <span class="icon icon-x" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E2B23A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg>
          </span>
          <span class="link-text">
            <span class="link-title">Twitter</span>
            <span class="link-sub">@KaeNoodle</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="arrow" aria-hidden="true"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
        </a>
      </nav>
    </div>
  </main>

  <footer>
    <span class="dot" aria-hidden="true"></span>
    <span>© 2026 KaeNoodle</span>
    <span class="dot" aria-hidden="true"></span>
  </footer>
</body>
</html>
