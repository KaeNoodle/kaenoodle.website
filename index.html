<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KaeNoodle</title>
  <meta name="description" content="Kae (KaeNoodle) is a fursuit maker and artist in Perth, Western Australia. Find me on Telegram and Twitter.">
  <meta property="og:title" content="KaeNoodle">
  <meta property="og:description" content="Fursuit maker and artist in Perth, Western Australia.">
  <meta property="og:url" content="https://kaenoodle.au/">
  <meta name="theme-color" content="#F05152">

  <!-- Favicon: the flower mark, inlined so there is no extra file to deploy -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='%23DF4278'%3E%3Ccircle cx='12' cy='6.2' r='3.8'/%3E%3Ccircle cx='17.5' cy='10.2' r='3.8'/%3E%3Ccircle cx='15.4' cy='16.7' r='3.8'/%3E%3Ccircle cx='8.6' cy='16.7' r='3.8'/%3E%3Ccircle cx='6.5' cy='10.2' r='3.8'/%3E%3C/g%3E%3Ccircle cx='12' cy='12' r='2.6' fill='%23C9971C'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       1. COLOURS
       Coral, blue and white are the main colours; gold is the
       accent. Everything else references these variables.
       ============================================================ */
    :root {
      --coral: #F05152;
      --blue: #217AF2;
      --gold: #C9971C;
      --gold-light: #E2B23A;
      --pink: #DF4278;
      --lavender: #D3D4F5;
      --ink: #1B1B2F;
      --ink-soft: #55566A;
      --ink-muted: #6B6C7E;
      --navy: #1F2039;
      --white: #FFFFFF;

      /* Icon tile colours, one per link */
      --tile-telegram: #1D6CD6;
      --tile-channel: #58B44B;
      --tile-twitter: var(--navy);

      --font-display: 'Bricolage Grotesque', 'Segoe UI', sans-serif;
      --font-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
    }

    /* ============================================================
       2. PAGE BASICS
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--white);
      color: var(--ink);
      font-family: var(--font-body);
    }

    /* Coral and blue band across the top, with a gold line under it */
    .band {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 12px;
      border-bottom: 3px solid var(--gold);
    }
    .band span:first-child { background: var(--coral); }
    .band span:last-child  { background: var(--blue); }

    main {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      background: var(--lavender);
    }

    .column {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 36px;
    }

    /* ============================================================
       3. INTRO
       Site name, gold rule, heading, tagline and the character.
       ============================================================ */
    .intro {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .site-name {
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--navy);
    }

    .rule {
      width: 72px;
      height: 4px;
      border-radius: 2px;
      background: var(--gold);
    }

    .intro h1 {
      margin: 0;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(3rem, 2rem + 5vw, 5.5rem);
      line-height: 0.95;
      letter-spacing: -0.03em;
      color: var(--gold);
    }
    .intro h1 span { color: var(--coral); }

    .tagline {
      margin: 0;
      font-size: 18px;
      line-height: 1.55;
      color: var(--ink);
    }
    .tagline span { display: block; padding-left: 1.5ch; }

    /* On phones the character sits at the top right, above the text */
    .character {
      order: -1;
      align-self: flex-end;
      width: 120px;
      height: auto;
    }

    /* From tablet width up it tucks in beside the heading */
    @media (min-width: 640px) {
      .character {
        position: absolute;
        top: -11px;
        right: -28px;
        width: 142px;
      }
    }

    /* ============================================================
       4. SOCIAL LINKS
       ============================================================ */
    .socials {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      border: 2px solid var(--ink);
      border-radius: 16px;
      background: var(--white);
      color: var(--ink);
      text-decoration: none;
      transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .link:hover {
      transform: translateY(-2px);
      border-color: var(--gold);
      box-shadow: 0 5px 0 var(--gold);
    }
    .link:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }

    .tile {
      flex: none;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tile-telegram { background: var(--tile-telegram); }
    .tile-channel  { background: var(--tile-channel); }
    .tile-twitter  { background: var(--tile-twitter); }

    .link-text {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .link-title  { font-size: 17px; font-weight: 600; }
    .link-detail { font-size: 15px; color: var(--ink-soft); }

    /* ============================================================
       5. FOOTER
       ============================================================ */
    footer {
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--ink-muted);
    }
    footer .dot {
      width: 6px;
      height: 6px;
      border-radius: 3px;
      background: var(--gold);
    }

    /* Respect people who have turned off animations */
    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
      .link:hover { transform: none; }
    }
  </style>
</head>
<body>

  <div class="band" aria-hidden="true"><span></span><span></span></div>

  <main>
    <div class="column">

      <section class="intro">
        <p class="site-name">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
            <g fill="#DF4278">
              <circle cx="12" cy="6.2" r="3.8"></circle>
              <circle cx="17.5" cy="10.2" r="3.8"></circle>
              <circle cx="15.4" cy="16.7" r="3.8"></circle>
              <circle cx="8.6" cy="16.7" r="3.8"></circle>
              <circle cx="6.5" cy="10.2" r="3.8"></circle>
            </g>
            <circle cx="12" cy="12" r="2.6" fill="#FFFFFF"></circle>
          </svg>
          kaenoodle.au
        </p>
        <div class="rule" aria-hidden="true"></div>
        <h1>Kae<span>Noodle</span></h1>
        <p class="tagline">Fursuit maker &amp; artist<span>Perth - Western Australia.</span></p>
        <img class="character" src="kae-character.webp" width="320" height="465"
             alt="Kae's character, a red dragon with blue and white tufts, hugging a spool of gold thread">
      </section>

      <nav class="socials" aria-label="Socials">
        <a class="link" href="https://t.me/KaeNoodle" target="_blank" rel="noopener">
          <span class="tile tile-telegram" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22 11 13 2 9 22 2z"></path></svg>
          </span>
          <span class="link-text">
            <span class="link-title">Telegram</span>
            <span class="link-detail">Message me · @KaeNoodle</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>
        </a>

        <a class="link" href="https://t.me/TheKaeRoom" target="_blank" rel="noopener">
          <span class="tile tile-channel" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"></path><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"></path></svg>
          </span>
          <span class="link-text">
            <span class="link-title">The Kae Room</span>
            <span class="link-detail">Telegram update channel · @TheKaeRoom</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>
        </a>

        <a class="link" href="https://x.com/KaeNoodle" target="_blank" rel="noopener">
          <span class="tile tile-twitter" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E2B23A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"></path></svg>
          </span>
          <span class="link-text">
            <span class="link-title">Twitter</span>
            <span class="link-detail">@KaeNoodle</span>
          </span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"></path><path d="M7 7h10v10"></path></svg>
        </a>
      </nav>

    </div>
  </main>

  <footer>
    <span class="dot" aria-hidden="true"></span>
    <span>© 2026 KaeNoodle</span>
    <span class="dot" aria-hidden="true"></span>
  </footer>

</body>
</html>
